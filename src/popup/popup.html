<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebClip</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="wc" aria-labelledby="wc-title">
    <header class="wc-header">
      <div class="wc-headrow">
        <div class="wc-brandblock">
          <div class="wc-brandline">
            <button type="button" id="wc-brand" class="wc-km-logo" title="WebClip on KnackMentor — knackmentor.com/webclip" aria-label="KnackMentor">
              <span class="km-knack">Knack</span><span class="km-mentor">Mentor</span>
            </button>
            <span class="wc-brand-sep" aria-hidden="true"></span>
            <h1 id="wc-title" class="wc-title">WebClip</h1>
          </div>
        </div>
        <div class="wc-headicons">
          <button type="button" id="wc-github" class="wc-icon" title="Source on GitHub" aria-label="Source on GitHub">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          </button>
          <button type="button" id="wc-help" class="wc-icon" title="Help &amp; source on GitHub" aria-label="Help and source on GitHub">?</button>
          <button type="button" id="wc-gear" class="wc-icon" title="Settings" aria-label="Settings">⚙</button>
        </div>
      </div>
      <p class="wc-source" id="wc-source" title="">Resolving active tab…</p>
    </header>

    <section class="wc-group" aria-labelledby="wc-capture-label">
      <h2 id="wc-capture-label" class="wc-group-title">Capture</h2>
      <label class="wc-radio">
        <input type="radio" name="mode" value="full-page" checked />
        <span>Full page</span>
      </label>
      <label class="wc-radio">
        <input type="radio" name="mode" value="visible" />
        <span>Visible area</span>
      </label>
    </section>

    <section class="wc-group" aria-labelledby="wc-pdf-label">
      <h2 id="wc-pdf-label" class="wc-group-title">PDF</h2>
      <div class="wc-row">
        <label class="wc-field">
          <span>Paper</span>
          <select id="wc-paper">
            <option value="AUTO" selected>Auto (one page)</option>
            <option value="A4">A4 (printable)</option>
            <option value="LETTER">Letter (printable)</option>
          </select>
        </label>
        <label class="wc-field">
          <span>Layout</span>
          <select id="wc-layout">
            <option value="auto" selected>Auto</option>
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </label>
      </div>
    </section>

    <button type="button" id="wc-capture" class="wc-button">Capture &amp; Save PDF</button>

    <div class="wc-actions">
      <button type="button" id="wc-pick" class="wc-link">Pick a section to capture…</button>
      <button type="button" id="wc-resplit" class="wc-iconbtn"
        title="Split a saved one-page PDF into printable A4 / Letter pages">✂ Split PDF</button>
    </div>

    <p class="wc-status" id="wc-status" role="status" aria-live="polite">Ready</p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
